name: CI

# seerr-mcp CI, on GitHub-hosted runners only. Nothing here reads a database and every crate is on
# crates.io, so no job needs a service container or a registry secret:
#
#   - test:    fmt, clippy, audit, the version-bump check and cargo test. Seerr and Hermes are wiremock
#              servers inside the tests, so nothing external is needed. The only job a pull request
#              runs, and it holds no secret and a read-only token.
#   - release: semantic-release on push to main (tag, Cargo bump, changelog.md).
#   - docker:  on a release only, the ARM64 image to GHCR, built natively on an ARM runner.
#
# Every action is pinned by commit SHA, with its tag in a comment for Renovate and for humans.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup reads rust-toolchain.toml, so this installs the pinned compiler with rustfmt and clippy.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-audit

      # Fail on any RustSec advisory.
      - name: Security audit
        run: cargo audit

      - name: Release version bump is cargo-free and cargo-correct
        run: bash scripts/set-version.test.sh

      - name: Test
        run: cargo test --locked

  release:
    needs: test
    # Never on pull_request: a fork's PR must not reach the deploy key or a write token.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    # No cargo here: the bump is scripts/set-version.sh, semantic-release is node.
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      released: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
    steps:
      # The release commit is pushed as this WRITE deploy key when main gets a ruleset (GITHUB_TOKEN
      # cannot push past one). Unset, checkout falls back to GITHUB_TOKEN, which is enough without a ruleset.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Run semantic-release
        id: semrel
        uses: cycjimmy/semantic-release-action@d9bf53a078bd2f86aaffaec796dbb3d28f1b6f34 # v8.1.3
        with:
          semantic_version: 25
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/exec@6
            @semantic-release/git@10
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    # Native arm64: no QEMU and no cross-compile, though the Dockerfile supports both.
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      # The release tag, not github.sha: semantic-release bumps Cargo.toml in a commit AFTER the
      # triggering one, so github.sha would compile in the previous version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ needs.release.outputs.version }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
            type=raw,value=${{ needs.release.outputs.version }}
          # metadata-action derives the version label from the FIRST tag, `latest`, and the description
          # from the repository's About text, and its labels override the Dockerfile's. Both are set
          # here so the image says what the code says, whatever the About text reads that day.
          labels: |
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.description=MCP server: each person in a household searches and requests films and series in Seerr as themselves, after a confirmation

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          pull: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            GIT_SHA=${{ github.sha }}
